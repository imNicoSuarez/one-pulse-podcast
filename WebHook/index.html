<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Test Webhook Basic Auth</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 18px; max-width: 900px; margin: auto; }
    label { display:block; margin-top:12px; font-weight:600; }
    input[type="text"], input[type="password"], textarea { width:100%; padding:8px; box-sizing:border-box; margin-top:6px; }
    textarea { min-height:120px; font-family: monospace; }
    button { margin-top:12px; padding:8px 14px; }
    pre { background:#0b1220; color:#cfe8ff; padding:12px; border-radius:6px; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; }
    .muted { color:#666; font-size:0.9em }
    .row { display:flex; gap:12px; }
    .col { flex:1; }
  </style>
</head>
<body>
  <h2>Probar Webhook (Basic Auth)</h2>
  <p class="muted">Este HTML enviará una petición POST con <code>Authorization: Basic</code>. Si el servidor no permite CORS para tu origen, el navegador bloqueará la petición (preflight OPTIONS).</p>

  <label for="url">Webhook URL</label>
  <input id="url" type="text" value="https://api.mercadolibre.com/workspace/genai/verdi-flows/webhook/0e28bda1-5ff7-4d46-9914-17b7c8ab3b72/external" />

  <div class="row">
    <div class="col">
      <label for="user">Usuario</label>
      <input id="user" type="text" value="nico" />
    </div>
    <div class="col">
      <label for="pass">Password</label>
      <input id="pass" type="password" value="12345" />
    </div>
  </div>

  <label for="type">Type</label>
  <input id="type" type="text" value="TEST" />

  <label for="payload">Payload (JSON)</label>
  <textarea id="payload">{ "message": "Hola desde HTML" }</textarea>

  <div style="margin-top:10px;">
    <button id="sendBtn">Enviar petición</button>
    <button id="curlBtn" title="Genera un curl equivalente" style="margin-left:8px;">Copiar cURL</button>
  </div>

  <h3>Resultado</h3>
  <pre id="output">Presiona "Enviar petición" para ver la respuesta.</pre>

<script>
  // tu función original (adaptada ligeramente para mostrar logs)
  function sendDirectRequest(webhookUrl, auth, type, payload) {
    const requestBody = {
      request: payload,
      type: type
    };

    // Convertir usuario:pass a Base64
    const basicAuthToken = btoa(`${auth.user}:${auth.pass}`);

    return new Promise((resolve, reject) => {
      const xmlhttp = new XMLHttpRequest();

      xmlhttp.onreadystatechange = function () {
        if (this.readyState === 4) {
          if (this.status >= 200 && this.status < 300) {
            try {
              const resp = JSON.parse(this.responseText);
              resolve(resp);
            } catch (e) {
              resolve({
                message: "Solicitud procesada (respuesta no JSON)",
                response_text: this.responseText,
              });
            }
          } else {
            let errorMessage = this.responseText;
            try {
              const resp = JSON.parse(this.responseText);
              errorMessage = resp.message || JSON.stringify(resp);
            } catch (e) {}
            reject(new Error(`Error ${this.status} al contactar webhook: ${errorMessage}`));
          }
        }
      };

      xmlhttp.open("POST", webhookUrl, true);

      // Encabezados
      xmlhttp.setRequestHeader("Authorization", `Basic ${basicAuthToken}`);
      xmlhttp.setRequestHeader("Content-Type", "application/json");

      xmlhttp.send(JSON.stringify(requestBody));
    });
  }

  // UI wiring
  const out = document.getElementById('output');
  const btn = document.getElementById('sendBtn');
  const curlBtn = document.getElementById('curlBtn');

  function setOutput(txt) { out.textContent = txt; }

  btn.addEventListener('click', async () => {
    const webhookUrl = document.getElementById('url').value.trim();
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const type = document.getElementById('type').value;
    let payloadText = document.getElementById('payload').value;

    let payload;
    try {
      payload = JSON.parse(payloadText);
    } catch (e) {
      setOutput("Payload no es JSON válido: " + e.message);
      return;
    }

    setOutput('Enviando petición... (si falla, revisá CORS / preflight en consola del navegador)');

    try {
      const result = await sendDirectRequest(webhookUrl, { user, pass }, type, payload);
      setOutput("✅ OK\n\n" + JSON.stringify(result, null, 2));
    } catch (err) {
      setOutput("❌ Error:\n\n" + (err && err.message ? err.message : String(err)));
      console.error('Error detalle:', err);
    }
  });

  curlBtn.addEventListener('click', () => {
    const webhookUrl = document.getElementById('url').value.trim();
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const type = document.getElementById('type').value;
    const payload = document.getElementById('payload').value;

    const curl = `curl -X POST "${webhookUrl}" -u ${user}:${pass} -H "Content-Type: application/json" -d '${JSON.stringify({ request: JSON.parse(payload), type }, null, 0)}'`;
    navigator.clipboard.writeText(curl).then(() => {
      alert('cURL copiado al portapapeles:\n\n' + curl);
    }).catch(()=> {
      prompt('cURL (copialo):', curl);
    });
  });
</script>
</body>
</html>
